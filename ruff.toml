# Line length and quotes follow the ROS 2 Python style (ament_flake8).
line-length = 99
extend-exclude = ["build", "install", "log", "runs", ".venv"]

[lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, NPY numpy,
# D pydocstyle
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "D"]

[lint.isort]
# Sort by module name, mixing `import x` and `from x import y` (ROS 2 / google import order).
force-sort-within-sections = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests do not need docstrings; ament_python packages keep them in test/.
"**/test/**" = ["D"]
"**/tests/**" = ["D"]
# setup.py of ament_python packages has no module docstring.
"**/setup.py" = ["D100"]

[format]
quote-style = "single"
