<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .t { font-size: 15px; font-weight: bold; }
    .s { font-size: 12px; fill: #4b5563; }
    .a { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .r { stroke: #374151; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="12" fill="#ffffff"/>

  <!-- Cabeceras -->
  <rect x="80" y="20" width="180" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="47" text-anchor="middle" class="t">Entorno: step()</text>
  <rect x="520" y="20" width="180" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="610" y="47" text-anchor="middle" class="t">Gazebo (en pausa)</text>
  <text x="390" y="46" text-anchor="middle" class="s">todo pasa por ros_gz_bridge</text>

  <line x1="170" y1="64" x2="170" y2="380" class="life"/>
  <line x1="610" y1="64" x2="610" y2="380" class="life"/>

  <!-- 1 y 2 -->
  <line x1="170" y1="100" x2="608" y2="100" class="a"/>
  <text x="390" y="93" text-anchor="middle">1. publica la acción en cmd_vel</text>
  <line x1="170" y1="145" x2="602" y2="145" class="a"/>
  <text x="390" y="138" text-anchor="middle">2. «avanza 100 iteraciones»</text>

  <!-- Gazebo trabajando -->
  <rect x="603" y="145" width="14" height="145" fill="#fed7aa" stroke="#ea580c"/>
  <text x="627" y="210">100 × 1 ms</text>
  <text x="627" y="227">= 0,1 s simulados</text>

  <!-- 3 -->
  <line x1="603" y1="190" x2="178" y2="190" class="r"/>
  <text x="390" y="183" text-anchor="middle">3. «aceptado» (aún va por la 56 de 100)</text>

  <!-- Entorno esperando -->
  <rect x="163" y="190" width="14" height="100" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="152" y="235" text-anchor="end">4. espera</text>
  <text x="152" y="252" text-anchor="end" class="s">(dormido, sin gastar CPU)</text>

  <!-- 5 -->
  <line x1="603" y1="290" x2="172" y2="290" class="a"/>
  <text x="390" y="283" text-anchor="middle">5. /clock = t + 0,1 s y odometría con ese sello</text>

  <!-- 6 -->
  <rect x="50" y="318" width="240" height="46" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="170" y="337" text-anchor="middle">6. ¿sello exacto? → observación,</text>
  <text x="170" y="355" text-anchor="middle">recompensa y fin de episodio</text>

  <text x="390" y="402" text-anchor="middle" class="s">Si el sello no es el esperado, el entorno se para con un error en vez de seguir con datos malos.</text>
</svg>
