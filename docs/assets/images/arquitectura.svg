<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 330" width="950" height="330">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .t { font-size: 16px; font-weight: bold; }
    .b { font-weight: bold; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 12px; }
    .a { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="950" height="330" rx="12" fill="#ffffff"/>

  <!-- Algoritmo -->
  <rect x="20" y="50" width="150" height="240" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" class="t">Algoritmo</text>
  <text x="95" y="172" text-anchor="middle" class="s">Stable-Baselines3</text>
  <text x="95" y="190" text-anchor="middle" class="s">(PPO)</text>

  <!-- Entorno Gymnasium -->
  <rect x="240" y="20" width="260" height="290" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="45" text-anchor="middle" class="t">Entorno Gymnasium</text>
  <text x="370" y="64" text-anchor="middle" class="m">ros_env.py</text>

  <rect x="260" y="80" width="220" height="60" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="370" y="104" text-anchor="middle" class="b">Hilo principal</text>
  <text x="370" y="124" text-anchor="middle" class="m">reset() · step()</text>

  <rect x="260" y="165" width="220" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="370" y="186" text-anchor="middle" class="b">Últimos mensajes + contador</text>
  <text x="370" y="204" text-anchor="middle" class="s">protegidos con un cerrojo</text>

  <rect x="260" y="240" width="220" height="55" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="370" y="263" text-anchor="middle" class="b">Hilo de ROS</text>
  <text x="370" y="282" text-anchor="middle" class="s">recibe mensajes y avisa</text>

  <line x1="320" y1="140" x2="320" y2="163" class="a"/>
  <text x="326" y="157" class="s">espera y lee</text>
  <line x1="420" y1="240" x2="420" y2="217" class="a"/>
  <text x="426" y="233" class="s">guarda</text>

  <!-- Algoritmo <-> Entorno -->
  <line x1="170" y1="100" x2="258" y2="100" class="a"/>
  <text x="214" y="93" text-anchor="middle" class="s">acción</text>
  <line x1="258" y1="125" x2="172" y2="125" class="a"/>
  <text x="214" y="142" text-anchor="middle" class="s">observación,</text>
  <text x="214" y="157" text-anchor="middle" class="s">recompensa</text>

  <!-- Entorno <-> bridge (ROS 2) -->
  <text x="540" y="65" text-anchor="middle" class="b">ROS 2</text>
  <line x1="480" y1="100" x2="598" y2="100" class="a"/>
  <text x="540" y="93" text-anchor="middle" class="m">cmd_vel</text>
  <line x1="480" y1="128" x2="598" y2="128" class="a"/>
  <text x="540" y="121" text-anchor="middle" class="m">control</text>
  <text x="540" y="145" text-anchor="middle" class="s">pausa, avanza, reset</text>
  <line x1="598" y1="258" x2="482" y2="258" class="a"/>
  <text x="540" y="251" text-anchor="middle" class="m">odom</text>
  <line x1="598" y1="283" x2="482" y2="283" class="a"/>
  <text x="540" y="276" text-anchor="middle" class="m">/clock</text>

  <!-- Bridge -->
  <rect x="600" y="50" width="120" height="240" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="150" text-anchor="middle" class="m b">ros_gz_bridge</text>
  <text x="660" y="172" text-anchor="middle" class="s">traduce</text>
  <text x="660" y="188" text-anchor="middle" class="s">ROS 2 ↔ Gazebo</text>

  <!-- Bridge <-> Gazebo -->
  <line x1="720" y1="155" x2="798" y2="155" class="a"/>
  <line x1="798" y1="185" x2="722" y2="185" class="a"/>
  <text x="760" y="145" text-anchor="middle" class="s">gz-transport</text>

  <!-- Gazebo -->
  <rect x="800" y="50" width="130" height="240" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="865" y="130" text-anchor="middle" class="t">Gazebo Jetty</text>
  <text x="865" y="155" text-anchor="middle" class="s">mundo en pausa</text>
  <text x="865" y="173" text-anchor="middle" class="s">física cada 1 ms</text>
  <text x="865" y="191" text-anchor="middle" class="s">robot DiffDrive</text>
</svg>
