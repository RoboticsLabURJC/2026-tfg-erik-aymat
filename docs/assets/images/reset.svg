<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .t { font-size: 15px; font-weight: bold; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 12px; }
    .a { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .w { fill: #ffffff; stroke: #9ca3af; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <g id="robot">
      <rect x="-9" y="-13" width="10" height="4" fill="#6b7280"/>
      <rect x="-9" y="9" width="10" height="4" fill="#6b7280"/>
      <rect x="-13" y="-9" width="26" height="18" rx="4" fill="#2563eb"/>
    </g>
  </defs>
  <rect width="760" height="300" rx="12" fill="#ffffff"/>

  <!-- Insertado después -->
  <rect x="20" y="20" width="350" height="260" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="48" text-anchor="middle" class="t">Insertado después de cargar el mundo</text>
  <text x="195" y="67" text-anchor="middle" class="m">ros_gz_sim create</text>

  <rect x="40" y="90" width="130" height="100" class="w"/>
  <use href="#robot" x="125" y="125"/>
  <text x="105" y="210" text-anchor="middle" class="s">antes</text>
  <line x1="176" y1="140" x2="210" y2="140" class="a"/>
  <text x="193" y="130" text-anchor="middle" class="s">reset</text>
  <rect x="220" y="90" width="130" height="100" class="w"/>
  <text x="285" y="145" text-anchor="middle" class="t" fill="#dc2626">sin robot ✗</text>
  <text x="285" y="210" text-anchor="middle" class="s">después</text>

  <text x="195" y="245" text-anchor="middle" class="s">El reset vuelve al estado inicial del mundo,</text>
  <text x="195" y="262" text-anchor="middle" class="s">y el robot no formaba parte de él.</text>

  <!-- Incluido desde el mundo -->
  <rect x="390" y="20" width="350" height="260" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="48" text-anchor="middle" class="t">Incluido desde el mundo</text>
  <text x="565" y="67" text-anchor="middle" class="m">&lt;include&gt; model://…/robot.urdf</text>

  <rect x="410" y="90" width="130" height="100" class="w"/>
  <use href="#robot" transform="translate(500,115) rotate(-35)"/>
  <text x="475" y="210" text-anchor="middle" class="s">antes</text>
  <line x1="546" y1="140" x2="580" y2="140" class="a"/>
  <text x="563" y="130" text-anchor="middle" class="s">reset</text>
  <rect x="590" y="90" width="130" height="100" class="w"/>
  <circle cx="655" cy="140" r="2" fill="#059669"/>
  <use href="#robot" x="655" y="140"/>
  <text x="655" y="210" text-anchor="middle" class="s">después</text>

  <text x="565" y="245" text-anchor="middle" class="s">El robot vuelve al origen, parado</text>
  <text x="565" y="262" text-anchor="middle" class="s">y con la odometría a cero ✓</text>
</svg>
