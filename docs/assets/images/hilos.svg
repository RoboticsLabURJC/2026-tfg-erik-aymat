<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .h { font-size: 15px; font-weight: bold; }
    .hs { font-size: 12px; fill: #4b5563; }
    .n { font-size: 18px; font-weight: bold; fill: #6b7280; }
    .s { font-size: 12px; fill: #4b5563; }
    .b { font-weight: bold; }
    .ok { fill: #047857; font-weight: bold; }
    .no { fill: #b91c1c; font-weight: bold; }
    .a { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .idle { fill: #f9fafb; stroke: #e5e7eb; }
    .main { fill: #f5f3ff; stroke: #7c3aed; }
    .zone { fill: #fef3c7; stroke: #d97706; }
    .ros { fill: #ecfdf5; stroke: #059669; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="574" rx="12" fill="#ffffff"/>

  <!-- Cabeceras -->
  <text x="200" y="34" text-anchor="middle" class="h">Hilo principal</text>
  <text x="200" y="52" text-anchor="middle" class="hs">ejecuta reset() y step()</text>
  <text x="470" y="34" text-anchor="middle" class="h">Zona compartida</text>
  <text x="470" y="52" text-anchor="middle" class="hs">protegida con un cerrojo</text>
  <text x="745" y="34" text-anchor="middle" class="h">Hilo de ROS</text>
  <text x="745" y="52" text-anchor="middle" class="hs">recibe los mensajes</text>

  <!-- 1 -->
  <text x="30" y="108" text-anchor="middle" class="n">1</text>
  <rect x="70" y="70" width="260" height="78" rx="8" class="main"/>
  <text x="84" y="96">Acaba de hacer el reset (reloj en 0).</text>
  <text x="84" y="116">Anota cuántas odometrías van:</text>
  <text x="84" y="136" class="b">«voy por la 57»</text>
  <rect x="350" y="70" width="240" height="78" rx="8" class="zone"/>
  <text x="364" y="96">Odometría nº 57, marca 12,3 s</text>
  <text x="364" y="116" class="s">(es del episodio anterior)</text>
  <text x="364" y="136">Contador: 57</text>
  <rect x="610" y="70" width="270" height="78" rx="8" class="idle"/>
  <text x="624" y="113" class="s">Nada que recibir: el mundo está en pausa</text>

  <!-- 2 -->
  <text x="30" y="198" text-anchor="middle" class="n">2</text>
  <rect x="70" y="160" width="260" height="78" rx="8" class="main"/>
  <text x="84" y="186">Pide a Gazebo avanzar 0,1 s</text>
  <text x="84" y="206">y se duerme, sin gastar CPU,</text>
  <text x="84" y="226">hasta que alguien le avise</text>
  <rect x="350" y="160" width="240" height="78" rx="8" class="idle"/>
  <text x="364" y="203" class="s">Sin cambios</text>
  <rect x="610" y="160" width="270" height="78" rx="8" class="idle"/>
  <text x="624" y="203" class="s">Gazebo empieza a simular</text>

  <!-- 3 -->
  <text x="30" y="298" text-anchor="middle" class="n">3</text>
  <rect x="70" y="250" width="260" height="112" rx="8" class="main"/>
  <text x="84" y="274">Se despierta y comprueba:</text>
  <text x="84" y="294">¿hay una odometría posterior a la 57?</text>
  <text x="84" y="314" class="no">No: vuelve a dormirse</text>
  <text x="84" y="336" class="s">Solo con la marca, la 57 habría valido:</text>
  <text x="84" y="352" class="s">12,3 s ≥ 0,1 s</text>
  <rect x="350" y="250" width="240" height="112" rx="8" class="zone"/>
  <text x="364" y="292">Reloj: 0,05 s</text>
  <text x="364" y="312" class="s">la odometría sigue siendo la 57</text>
  <rect x="610" y="250" width="270" height="112" rx="8" class="ros"/>
  <text x="624" y="284">Llega el reloj de la simulación:</text>
  <text x="624" y="304">lo guarda y avisa</text>
  <line x1="608" y1="299" x2="592" y2="299" class="a"/>
  <line x1="348" y1="299" x2="332" y2="299" class="a"/>
  <!-- 4 -->
  <text x="30" y="412" text-anchor="middle" class="n">4</text>
  <rect x="70" y="374" width="260" height="78" rx="8" class="idle"/>
  <text x="84" y="417" class="s">Durmiendo</text>
  <rect x="350" y="374" width="240" height="78" rx="8" class="zone"/>
  <text x="364" y="406" class="b">Odometría nº 58, marca 0,1 s</text>
  <text x="364" y="426">Contador: 58</text>
  <rect x="610" y="374" width="270" height="78" rx="8" class="ros"/>
  <text x="624" y="400">Llega la odometría del final</text>
  <text x="624" y="420">del paso: la guarda, suma uno</text>
  <text x="624" y="440">al contador y avisa</text>
  <line x1="608" y1="413" x2="592" y2="413" class="a"/>
  <line x1="348" y1="413" x2="332" y2="413" class="a"/>

  <!-- 5 -->
  <text x="30" y="502" text-anchor="middle" class="n">5</text>
  <rect x="70" y="464" width="260" height="90" rx="8" class="main"/>
  <text x="84" y="488">Se despierta y comprueba:</text>
  <text x="84" y="508">¿posterior a la 57? <tspan class="ok">Sí (58)</tspan></text>
  <text x="84" y="528">¿marca exacta 0,1 s? <tspan class="ok">Sí</tspan></text>
  <text x="84" y="546">Devuelve la observación</text>
  <rect x="350" y="464" width="240" height="90" rx="8" class="idle"/>
  <text x="364" y="513" class="s">Sin cambios</text>
  <rect x="610" y="464" width="270" height="90" rx="8" class="idle"/>
  <text x="624" y="513" class="s">Sigue recibiendo mensajes</text>
</svg>
